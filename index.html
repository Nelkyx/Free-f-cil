<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fácil</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --success-hover: #047857;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        #data-atual-label {
            font-size: 0.75rem;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
        }

        main {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            main {
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .card h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 0.875rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.625rem;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            flex: 1;
            background-color: var(--success);
            color: white;
            padding: 0.75rem;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .btn-danger-light {
            background-color: #ffe4e6;
            color: #e11d48;
            padding: 0.75rem 1rem;
        }

        .btn-danger-light:hover {
            background-color: #fecdd3;
        }

        .flex-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .list-container {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .item-card {
            background-color: #f8fafc;
            padding: 0.875rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .item-info p.nome {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .item-info span.setor {
            font-size: 0.75rem;
            font-weight: normal;
            color: var(--text-muted);
        }

        .item-info p.valor {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 0.125rem;
        }

        .item-info p.ref {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .item-actions {
            display: flex;
            gap: 0.25rem;
        }

        .action-btn {
            padding: 0.35rem 0.5rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.75rem;
        }

        .action-btn.delete {
            background-color: #fff1f2;
            color: #e11d48;
            border-color: #fecdd3;
        }

        .action-btn:hover {
            opacity: 0.85;
        }

        .hidden {
            display: none !important;
        }

        .text-total {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
        }

        .empty-msg {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            padding: 1.5rem 0;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="header-container">
            <h1>Free Fácil 🚀</h1>
            <span id="data-atual-label"></span>
        </div>
    </header>

    <main>
        <!-- Coluna Esquerda: Formulário -->
        <section class="card">
            <h2>Novo Free</h2>

            <div class="form-group">
                <label>Data</label>
                <input type="date" id="input-data">
            </div>

            <div class="form-group">
                <label>Nome do Funcionário</label>
                <input type="text" id="input-nome" placeholder="Ex: Damian">
            </div>

            <div class="form-group">
                <label>Setor</label>
                <select id="input-setor">
                    <option value="Salão">Salão</option>
                    <option value="Caixa">Caixa</option>
                    <option value="Cozinha">Cozinha</option>
                    <option value="S.G.">S.G.</option>
                    <option value="Bar">Bar</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tipo de Free</label>
                <select id="input-tipo" onchange="alternarCamposHorario()">
                    <option value="completo">Turno completo</option>
                    <option value="parcial">Horário parcial</option>
                    <option value="extra">Extra após o ponto</option>
                </select>
            </div>

            <div id="bloco-completo" class="form-group">
                <label>Horário do Turno</label>
                <select id="input-turno-completo">
                    <option value="10h30 - 19h">10h30 às 19h (R$ 120,00)</option>
                    <option value="14h - 22h30">14h às 22h30 (R$ 120,00)</option>
                    <option value="8h - 16h30">8h às 16h30 (R$ 120,00)</option>
                </select>
            </div>

            <div id="bloco-horarios" class="hidden grid-2 form-group">
                <div>
                    <label id="label-inicio-txt">Início / Horas</label>
                    <input type="text" id="input-inicio" placeholder="Ex: 19h ou 2">
                </div>
                <div id="wrapper-saida">
                    <label>Saída (se parcial)</label>
                    <input type="text" id="input-saida" placeholder="Ex: 22h">
                </div>
            </div>

            <button onclick="adicionarFree()" class="btn-primary">ADICIONAR FREE</button>
        </section>

        <!-- Coluna Direita: Listagem e Texto -->
        <div>
            <section class="card">
                <div class="flex-row justify-between" style="margin-bottom: 1rem;">
                    <h2>Frees do Dia</h2>
                    <span id="total-geral" class="text-total">Total: R$ 0,00</span>
                </div>

                <div id="lista-frees" class="list-container">
                    <!-- Dinâmico -->
                </div>

                <div class="flex-row" style="margin-top: 1rem;">
                    <button onclick="gerarTexto()" class="btn-success">GERAR TEXTO</button>
                    <button onclick="limparTudo()" class="btn-danger-light">Limpar</button>
                </div>
            </section>

            <section id="secao-texto" class="card hidden">
                <h2>Texto para Copiar</h2>
                <div class="form-group">
                    <textarea id="texto-gerado" rows="5" readonly></textarea>
                </div>
                <button onclick="copiarTexto()" class="btn-primary" style="background-color: #1e293b;">📋 COPIAR TEXTO PRONTO</button>
            </section>
        </div>
    </main>

    <script>
        document.getElementById('input-data').valueAsDate = new Date();
        let editandoId = null;

        function getDataSelecionada() {
            return document.getElementById('input-data').value;
        }

        function carregarDados() {
            const dados = localStorage.getItem('frees_app_data');
            return dados ? JSON.parse(dados) : {};
        }

        function salvarDados(dados) {
            localStorage.setItem('frees_app_data', JSON.stringify(dados));
            atualizarTela();
        }

        function alternarCamposHorario() {
            const tipo = document.getElementById('input-tipo').value;
            const blocoCompleto = document.getElementById('bloco-completo');
            const blocoHorarios = document.getElementById('bloco-horarios');
            const labelInicio = document.getElementById('label-inicio-txt');
            const wrapperSaida = document.getElementById('wrapper-saida');

            if (tipo === 'completo') {
                blocoCompleto.classList.remove('hidden');
                blocoHorarios.classList.add('hidden');
            } else {
                blocoCompleto.classList.add('hidden');
                blocoHorarios.classList.remove('hidden');
                if (tipo === 'extra') {
                    labelInicio.innerText = "Qtd Horas (Ex: 1 ou 2)";
                    wrapperSaida.style.display = 'none';
                } else {
                    labelInicio.innerText = "Entrada";
                    wrapperSaida.style.display = 'block';
                }
            }
        }

        function calcularValor(tipo, extraInfo, inicio, saida) {
            if (tipo === 'completo') {
                return { valor: 120.00, ref: `ref ao horário das ${extraInfo}` };
            } else if (tipo === 'extra') {
                const qtd = parseInt(inicio) || 1;
                const valor = qtd * 20.00;
                const termoHora = qtd === 1 ? 'uma hora extra' : `${qtd} horas extra`;
                return { valor: valor, ref: `ref a ${termoHora}` };
            } else {
                const hIn = parseInt(inicio) || 0;
                const hOut = parseInt(saida) || 0;
                let horas = hOut - hIn;
                if (horas <= 0) horas = 3; 
                const valor = horas * 15.00;
                return { valor: valor, ref: `ref ao horário das ${inicio} - ${saida}` };
            }
        }

        function adicionarFree() {
            const data = getDataSelecionada();
            const nome = document.getElementById('input-nome').value.trim();
            const setor = document.getElementById('input-setor').value;
            const tipo = document.getElementById('input-tipo').value;
            const extraInfo = document.getElementById('input-turno-completo').value;
            const inicio = document.getElementById('input-inicio').value;
            const saida = document.getElementById('input-saida').value;

            if (!nome) {
                alert('Por favor, digite o nome do funcionário.');
                return;
            }

            const calc = calcularValor(tipo, extraInfo, inicio, saida);
            const db = carregarDados();
            if (!db[data]) db[data] = [];

            if (editandoId !== null) {
                db[data][editandoId] = { nome, setor, valor: calc.valor, ref: calc.ref };
                editandoId = null;
            } else {
                db[data].push({ nome, setor, valor: calc.valor, ref: calc.ref });
            }

            salvarDados(db);

            document.getElementById('input-nome').value = '';
            document.getElementById('input-inicio').value = '';
            document.getElementById('input-saida').value = '';
        }

        function atualizarTela() {
            const data = getDataSelecionada();
            const db = carregarDados();
            const lista = db[data] || [];
            
            const container = document.getElementById('lista-frees');
            container.innerHTML = '';

            let totalGeral = 0;

            if (lista.length === 0) {
                container.innerHTML = `<p class="empty-msg">Nenhum free cadastrado nesta data.</p>`;
            }

            lista.forEach((item, index) => {
                totalGeral += item.valor;
                const div = document.createElement('div');
                div.className = "item-card";
                div.innerHTML = `
                    <div class="item-info">
                        <p class="nome">${item.nome} <span class="setor">(${item.setor})</span></p>
                        <p class="valor">R$ ${item.valor.toFixed(2).replace('.', ',')}</p>
                        <p class="ref">${item.ref}</p>
                    </div>
                    <div class="item-actions">
                        <button onclick="editarFree(${index})" class="action-btn">✏️</button>
                        <button onclick="removerFree(${index})" class="action-btn delete">🗑️</button>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('total-geral').innerText = `Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            
            const partes = data.split('-');
            if(partes.length === 3) {
                document.getElementById('data-atual-label').innerText = `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
        }

        function removerFree(index) {
            const data = getDataSelecionada();
            const db = carregarDados();
            if (db[data]) {
                db[data].splice(index, 1);
                salvarDados(db);
            }
        }

        function editarFree(index) {
            const data = getDataSelecionada();
            const db = carregarDados();
            const item = db[data][index];

            document.getElementById('input-nome').value = item.nome;
            document.getElementById('input-setor').value = item.setor;
            editandoId = index;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limparTudo() {
            if (confirm('Deseja limpar todos os frees desta data?')) {
                const data = getDataSelecionada();
                const db = carregarDados();
                delete db[data];
                salvarDados(db);
            }
        }

        function gerarTexto() {
            const data = getDataSelecionada();
            const db = carregarDados();
            const lista = db[data] || [];

            if (lista.length === 0) {
                alert('Não há frees cadastrados para gerar texto.');
                return;
            }

            const partesData = data.split('-');
            const dataFormatada = `${partesData[2]}/${partesData[1]}`;

            let texto = `Free ${dataFormatada} pagos\n\n`;

            lista.forEach(item => {
                const setorMinusculo = item.setor.toLowerCase();
                const valorFormatado = `R$ ${item.valor.toFixed(2).replace('.', ',')}`;
                texto += `${item.nome}(${setorMinusculo}) ${valorFormatado} / ${item.ref}\n\n`;
            });

            document.getElementById('secao-texto').classList.remove('hidden');
            document.getElementById('texto-gerado').value = texto.trim();
        }

        function copiarTexto() {
            const textarea = document.getElementById('texto-gerado');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert('Texto copiado para a área de transferência!');
            });
        }

        document.getElementById('input-data').addEventListener('change', atualizarTela);

        atualizarTela();
        alternarCamposHorario();
    </script>
</body>
</html>
